<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex">
<title>Mockup — Portal cronômetro interativo (todas as fases)</title>
<link href="https://fonts.googleapis.com/css2?family=Fredoka+One&family=Nunito:wght@400;600;700;800;900&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../../mk-design.css?v=1.9.90">
<style>
  /* Mock-only shell — não copiar para produção */
  :root {
    --mock-ink: #0d1b3e;
    --mock-gold: #FFD54F;
    --mock-blue: #29B6F6;
    --mock-orange: #FF8A65;
  }
  * { box-sizing: border-box; }
  body.mock-shell {
    margin: 0;
    min-height: 100dvh;
    font-family: 'Nunito', system-ui, sans-serif;
    color: #e8eefc;
    background:
      radial-gradient(ellipse at 20% 0%, #3949ab 0%, transparent 50%),
      radial-gradient(ellipse at 90% 20%, #1565c0 0%, transparent 45%),
      linear-gradient(160deg, #0a1228 0%, #121f44 50%, #0d1b3e 100%);
  }
  .mock-top {
    max-width: 1100px;
    margin: 0 auto;
    padding: 20px 16px 8px;
  }
  .mock-brand {
    font-family: 'Fredoka One', cursive;
    font-size: 28px;
    margin: 0 0 4px;
    letter-spacing: 0.02em;
  }
  .mock-brand span { color: var(--mock-gold); }
  .mock-lead {
    margin: 0 0 16px;
    font-size: 14px;
    font-weight: 700;
    opacity: 0.85;
    max-width: 52ch;
    line-height: 1.45;
  }
  .mock-phases {
    display: flex;
    flex-wrap: wrap;
    gap: 8px;
    margin-bottom: 18px;
  }
  .mock-phase-btn {
    border: 1px solid rgba(255,255,255,0.22);
    background: rgba(255,255,255,0.06);
    color: #fff;
    font-family: inherit;
    font-weight: 800;
    font-size: 12px;
    padding: 8px 12px;
    border-radius: 999px;
    cursor: pointer;
    transition: transform .15s, background .2s, border-color .2s;
  }
  .mock-phase-btn:hover { transform: translateY(-1px); background: rgba(255,255,255,0.12); }
  .mock-phase-btn.is-on {
    background: linear-gradient(180deg, #FFD54F, #ffb300);
    color: #1a237e;
    border-color: transparent;
  }
  .mock-layout {
    max-width: 1100px;
    margin: 0 auto;
    padding: 0 16px 40px;
    display: grid;
    grid-template-columns: minmax(280px, 360px) 1fr;
    gap: 28px;
    align-items: start;
  }
  @media (max-width: 820px) {
    .mock-layout { grid-template-columns: 1fr; justify-items: center; }
    .mock-aside { order: 2; width: 100%; max-width: 420px; }
  }
  .mock-phone {
    width: min(100%, 360px);
    border-radius: 36px;
    padding: 12px;
    background: linear-gradient(145deg, #2a3558, #151d33);
    box-shadow:
      0 0 0 1px rgba(255,255,255,0.12),
      0 30px 60px rgba(0,0,0,0.45);
  }
  .mock-phone-notch {
    width: 110px;
    height: 22px;
    margin: 0 auto 8px;
    background: #0a1020;
    border-radius: 0 0 14px 14px;
  }
  .mock-phone-screen {
    border-radius: 28px;
    overflow: hidden;
    min-height: 640px;
    position: relative;
  }
  .mock-phone-screen .mk-portal-page {
    min-height: 640px;
    padding: 18px 14px 72px;
    justify-content: flex-start;
  }
  .mock-aside h2 {
    font-family: 'Fredoka One', cursive;
    font-size: 22px;
    margin: 0 0 8px;
  }
  .mock-aside p {
    margin: 0 0 14px;
    font-size: 14px;
    font-weight: 700;
    line-height: 1.45;
    opacity: 0.9;
  }
  .mock-card {
    background: rgba(255,255,255,0.07);
    border: 1px solid rgba(255,255,255,0.14);
    border-radius: 16px;
    padding: 14px 16px;
    margin-bottom: 10px;
  }
  .mock-card strong {
    display: block;
    font-size: 13px;
    margin-bottom: 4px;
    color: var(--mock-gold);
  }
  .mock-card span {
    font-size: 13px;
    font-weight: 700;
    opacity: 0.88;
    line-height: 1.4;
  }
  .mock-badge {
    display: inline-block;
    font-size: 10px;
    font-weight: 900;
    letter-spacing: .06em;
    text-transform: uppercase;
    padding: 3px 8px;
    border-radius: 99px;
    background: rgba(79,195,247,.2);
    color: #81d4fa;
    margin-bottom: 6px;
  }

  /* Novos blocos propostos (mock) */
  .mk-portal-coach {
    width: 100%;
    max-width: 340px;
    margin: 12px auto 0;
    padding: 12px 14px;
    border-radius: 16px;
    background: rgba(255,255,255,0.10);
    border: 1px solid rgba(255,255,255,0.2);
    text-align: left;
    animation: mk-portal-pop .35s ease-out;
  }
  .mk-portal-coach-kicker {
    font-size: 10px;
    font-weight: 900;
    letter-spacing: .08em;
    text-transform: uppercase;
    opacity: .7;
    margin: 0 0 4px;
  }
  .mk-portal-coach-title {
    margin: 0 0 2px;
    font-size: 15px;
    font-weight: 900;
    line-height: 1.25;
  }
  .mk-portal-coach-sub {
    margin: 0;
    font-size: 12px;
    font-weight: 700;
    opacity: .8;
    line-height: 1.35;
  }
  .mk-portal-coach.is-warn {
    background: rgba(255,213,79,0.18);
    border-color: rgba(255,213,79,0.45);
  }
  .mk-portal-coach.is-extra {
    background: rgba(255,138,101,0.2);
    border-color: rgba(255,138,101,0.5);
  }
  .mk-portal-coach.is-magic {
    background: linear-gradient(135deg, rgba(79,195,247,.22), rgba(255,213,79,.16));
    border-color: rgba(255,255,255,.28);
  }
  .mk-portal-milestone {
    display: inline-flex;
    align-items: center;
    gap: 6px;
    margin: 10px auto 0;
    padding: 6px 12px;
    border-radius: 999px;
    background: rgba(255,213,79,0.2);
    border: 1px solid rgba(255,213,79,0.4);
    font-size: 12px;
    font-weight: 900;
    color: #FFE082;
    animation: mk-portal-pop .4s ease-out;
  }
  .mk-portal-trophy {
    margin: 10px auto 0;
    max-width: 340px;
    padding: 10px 12px;
    border-radius: 14px;
    background: rgba(255,255,255,0.08);
    border: 1px dashed rgba(255,213,79,0.45);
    font-size: 12px;
    font-weight: 800;
    line-height: 1.35;
  }
  .mk-portal-share-row {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 8px;
    width: 100%;
    max-width: 340px;
    margin: 10px auto 0;
  }
  .mk-portal-share-btn {
    height: 44px;
    border: none;
    border-radius: 22px;
    font-family: inherit;
    font-weight: 900;
    font-size: 13px;
    cursor: pointer;
    color: #1a237e;
    background: linear-gradient(180deg, #FFD54F, #ffb300);
  }
  .mk-portal-share-btn.sec {
    color: #fff;
    background: rgba(255,255,255,0.14);
    border: 1px solid rgba(255,255,255,0.25);
  }
  .mk-portal-extend {
    width: 100%;
    max-width: 340px;
    margin: 10px auto 0;
    height: 44px;
    border-radius: 22px;
    border: 2px solid rgba(255,213,79,0.55);
    background: rgba(255,213,79,0.12);
    color: #FFE082;
    font-family: inherit;
    font-weight: 900;
    font-size: 13px;
    cursor: pointer;
  }
  .mk-portal-pwa-hint {
    margin: 14px auto 0;
    font-size: 11px;
    font-weight: 800;
    opacity: .65;
  }
  .mock-hidden { display: none !important; }
  .mk-portal-face--lg img { width: 56px; height: 56px; border-radius: 50%; }
  .mk-portal-play-name { font-family: 'Fredoka One', cursive; font-size: 26px; margin: 6px 0 4px; }
</style>
</head>
<body class="mock-shell">

<header class="mock-top">
  <h1 class="mock-brand">Movi <span>Kids</span> — mockup portal</h1>
  <p class="mock-lead">Todas as fases da experiência proposta para o responsável. Clique nas fases para ver o celular mudar. Protótipo — não é produção.</p>
  <div class="mock-phases" id="phase-bar" role="tablist" aria-label="Fases do mockup"></div>
</header>

<div class="mock-layout">
  <div class="mock-phone" aria-label="Prévia mobile">
    <div class="mock-phone-notch" aria-hidden="true"></div>
    <div class="mock-phone-screen">
      <div class="mk-portal-page" data-view="play" id="phone">
        <div class="mk-portal-glow" aria-hidden="true"></div>
        <div class="mk-portal-deco" aria-hidden="true"></div>
        <div class="mk-portal-carousel" id="stage"></div>
      </div>
    </div>
  </div>

  <aside class="mock-aside" id="aside">
    <h2 id="aside-title">—</h2>
    <p id="aside-desc">—</p>
    <div id="aside-cards"></div>
  </aside>
</div>

<script>
const RING_C = 2 * Math.PI * 88;
const phases = [
  {
    id: 'pendente',
    label: '1 · Já já começa',
    title: 'Pendente — preparando',
    desc: 'Anel cheio (pronto). Coach acalma: não precisa ir ao balcão ainda.',
    remSec: 20 * 60,
    totalSec: 20 * 60,
    fill: 1,
    state: 'pend',
    lbl: 'JÁ JÁ COMEÇA',
    time: '20:00',
    milestone: null,
    coach: {
      cls: '',
      kicker: 'Agora',
      title: 'Preparando o Carro 01…',
      sub: 'Pode ficar por perto — em instantes a brincadeira começa.'
    },
    fotoLabel: '📸 Depois: tire uma foto',
    fotoMuted: true,
    showShare: false,
    showExtend: false,
    showTrophy: false,
    alert: null,
    cards: [
      ['Confiança', 'Status claro sem precisar perguntar no balcão'],
      ['Anel', 'Cheio = pronto para começar']
    ]
  },
  {
    id: 'inicio',
    label: '2 · Começou',
    title: 'Ativa — primeiros minutos',
    desc: 'Anel começa a encher. Coach libera o adulto para passear.',
    remSec: 18 * 60,
    totalSec: 20 * 60,
    fill: 0.1,
    state: 'ok',
    lbl: 'FALTA',
    time: '18:00',
    milestone: null,
    coach: {
      cls: '',
      kicker: 'O que fazer agora',
      title: 'Pode passear no corredor',
      sub: 'Falta bastante tempo — avisamos aqui quando for hora de voltar.'
    },
    fotoLabel: '📸 Captura o momento',
    fotoMuted: false,
    showShare: false,
    showExtend: false,
    showTrophy: true,
    trophy: '🏅 1ª volta da Analu neste app',
    alert: null,
    cards: [
      ['Utilidade', 'Adulto não fica “preso” no balcão'],
      ['Orgulho', 'Troféu leve na primeira visita']
    ]
  },
  {
    id: 'metade',
    label: '3 · Metade',
    title: 'Marco 50% — momento mágico',
    desc: 'Pill de marco + frase emocional. Motivo para olhar de novo a tela.',
    remSec: 10 * 60,
    totalSec: 20 * 60,
    fill: 0.5,
    state: 'ok',
    lbl: 'FALTA',
    time: '10:00',
    milestone: '✨ Metade da aventura da Analu',
    coach: {
      cls: 'is-magic',
      kicker: 'Marco',
      title: 'A brincadeira está no auge',
      sub: 'Ainda dá tempo de um lanche rápido — a página te chama nos 5 minutos finais.'
    },
    fotoLabel: '📸 Captura o momento',
    fotoMuted: false,
    showShare: false,
    showExtend: false,
    showTrophy: false,
    alert: null,
    cards: [
      ['Atenção', 'Marcos criam “gancho” sem notificação invasiva'],
      ['Anel', 'Enche com o decorrido (~50%)']
    ]
  },
  {
    id: 'quase',
    label: '4 · Quase lá',
    title: '≤ 5 min — hora de voltar',
    desc: 'Amarelo + tick. Coach muda para ação. Foto vira “última da volta”.',
    remSec: 4 * 60 + 12,
    totalSec: 20 * 60,
    fill: 0.79,
    state: 'warn',
    lbl: 'QUASE LÁ!',
    time: '04:12',
    milestone: null,
    coach: {
      cls: 'is-warn',
      kicker: 'Atenção',
      title: 'Hora de voltar perto do balcão',
      sub: 'Faltam poucos minutos — melhor estar por perto.'
    },
    fotoLabel: '📸 Última foto da volta',
    fotoMuted: false,
    showShare: false,
    showExtend: true,
    showTrophy: false,
    alert: 'Analu em 04:12 — atenção!',
    cards: [
      ['Utilidade genial', 'A página decide por ele: voltar agora'],
      ['Negócio', 'CTA suave para pedir mais tempo no balcão']
    ]
  },
  {
    id: 'extra',
    label: '5 · Tempo extra',
    title: 'Extra — buscar agora',
    desc: 'Anel cheio laranja + pulso. Urgência clara, sem drama feio.',
    remSec: -(2 * 60 + 18),
    totalSec: 20 * 60,
    fill: 1,
    state: 'extra',
    lbl: 'TEMPO EXTRA',
    time: '+02:18',
    milestone: null,
    coach: {
      cls: 'is-extra',
      kicker: 'Agora',
      title: 'Busque a Analu no balcão',
      sub: 'O tempo do plano acabou — o operador já está ciente.'
    },
    fotoLabel: '📸 Foto da despedida',
    fotoMuted: false,
    showShare: false,
    showExtend: false,
    showTrophy: false,
    alert: 'Analu em tempo extra — buscar!',
    alertExtra: true,
    cards: [
      ['Confiança', 'Transparência no extra reduz atrito no balcão'],
      ['Anel', 'Cheio + pulso = estado crítico']
    ]
  },
  {
    id: 'foto',
    label: '6 · Foto + share',
    title: 'Ritual da foto — viral',
    desc: 'Depois da moldura: share em 1 toque com legenda pronta. Marketing feito pelo responsável.',
    remSec: 7 * 60 + 38,
    totalSec: 20 * 60,
    fill: 0.62,
    state: 'ok',
    lbl: 'FALTA',
    time: '07:38',
    milestone: '📷 Momento capturado!',
    coach: {
      cls: 'is-magic',
      kicker: 'Compartilhar',
      title: 'Mostre a Analu no Stories',
      sub: 'Legenda pronta com @movikidsslz · Golden Shopping Calhau'
    },
    fotoLabel: '✅ Foto pronta na moldura',
    fotoMuted: false,
    showShare: true,
    showExtend: false,
    showTrophy: false,
    alert: null,
    cards: [
      ['Orgulho', 'Pai/mãe mostra a tela — vende o serviço'],
      ['Retenção', 'Motivo emocional para reabrir o portal']
    ]
  },
  {
    id: 'familia',
    label: '7 · Família',
    title: 'Duas crianças — mesmo telefone',
    desc: 'Carrossel + lista “outras”. Coach e anel focam na criança ativa.',
    remSec: 12 * 60,
    totalSec: 20 * 60,
    fill: 0.4,
    state: 'ok',
    lbl: 'FALTA',
    time: '12:00',
    milestone: null,
    coach: {
      cls: '',
      kicker: 'Família',
      title: 'Analu e Miguel brincando',
      sub: 'Deslize ou toque para ver o tempo do Miguel.'
    },
    fotoLabel: '📸 Foto da Analu',
    fotoMuted: false,
    showShare: false,
    showExtend: false,
    showTrophy: true,
    trophy: '👨‍👧‍👦 2 crianças no mesmo telefone — família em ação',
    multi: true,
    alert: null,
    cards: [
      ['Clareza', 'Um hero por vez — abas + pills'],
      ['Hábito', 'Um telefone, toda a família']
    ]
  }
];

function ringDash(fill) {
  const p = Math.max(0, Math.min(1, fill));
  return { vis: RING_C * p, circ: RING_C };
}

function renderPhase(p) {
  const dash = ringDash(p.fill);
  const playCls = 'mk-portal-play'
    + (p.state === 'extra' ? ' is-extra' : '')
    + (p.state === 'warn' ? ' is-warn' : '')
    + (p.state === 'pend' ? ' is-wait' : '');
  const ringCls = p.state === 'extra' ? 'extra' : (p.state === 'pend' ? 'wait' : (p.state === 'warn' ? 'warn' : 'ok'));
  const stLabel = p.state === 'pend' ? 'Pendente' : (p.state === 'extra' ? 'Extra' : 'Ativa');
  const stCls = p.state === 'pend' ? 'is-pend' : 'is-ativa';

  const tabs = p.multi
    ? `<div class="mk-portal-tabs" role="tablist">
        <button type="button" class="mk-portal-tab is-active">Analu</button>
        <button type="button" class="mk-portal-tab">Miguel</button>
      </div>
      <p class="mk-portal-counter">Criança 1 de 2</p>`
    : '';

  const others = p.multi
    ? `<section class="mk-portal-others">
        <p class="mk-portal-others-title">Outras no mesmo telefone</p>
        <button type="button" class="mk-portal-other-row">
          ${avatar('Miguel')}
          <span class="mk-portal-other-name">Miguel</span>
          <span class="mk-portal-other-pill">08:40</span>
        </button>
      </section>`
    : '';

  const alert = p.alert
    ? `<p class="mk-portal-alert${p.alertExtra ? ' is-extra' : ''}">${p.alert}</p>`
    : '';

  const milestone = p.milestone
    ? `<div class="mk-portal-milestone">${p.milestone}</div>`
    : '';

  const coach = p.coach
    ? `<div class="mk-portal-coach ${p.coach.cls || ''}">
        <p class="mk-portal-coach-kicker">${p.coach.kicker}</p>
        <p class="mk-portal-coach-title">${p.coach.title}</p>
        <p class="mk-portal-coach-sub">${p.coach.sub}</p>
      </div>`
    : '';

  const trophy = p.showTrophy && p.trophy
    ? `<div class="mk-portal-trophy">${p.trophy}</div>`
    : '';

  const share = p.showShare
    ? `<div class="mk-portal-share-row">
        <button type="button" class="mk-portal-share-btn">Stories</button>
        <button type="button" class="mk-portal-share-btn sec">WhatsApp</button>
      </div>`
    : '';

  const extend = p.showExtend
    ? `<button type="button" class="mk-portal-extend">⏱ Quero mais tempo — peço no balcão</button>`
    : '';

  const fotoStyle = p.fotoMuted ? 'opacity:.55' : '';

  document.getElementById('stage').innerHTML = `
    <p class="mk-portal-subtitle">📱 (98) 98888-5624 · ${p.multi ? '2 brincando' : '1 brincando'} · <button type="button" class="mk-portal-tel-link">Trocar telefone</button></p>
    ${tabs}
    ${alert}
    <article class="${playCls}">
      <div class="mk-portal-play-hero">
        ${avatar('Analu', true)}
        <div class="mk-portal-play-name">Analu</div>
      </div>
      ${milestone}
      <div class="mk-portal-play-ring">
        <svg viewBox="0 0 200 200" aria-hidden="true">
          <circle class="mk-portal-ring-bg" cx="100" cy="100" r="88"></circle>
          <circle class="mk-portal-ring-prog ${ringCls}" cx="100" cy="100" r="88"
            style="stroke-dasharray:${dash.vis.toFixed(1)} ${dash.circ.toFixed(1)};stroke-dashoffset:0"></circle>
        </svg>
        <div class="mk-portal-ring-center">
          <span class="mk-portal-ring-lbl">${p.lbl}</span>
          <b class="mk-portal-ring-time">${p.time}</b>
        </div>
      </div>
      ${p.state === 'pend' ? '<p class="mk-portal-play-msg">Preparando o veículo…</p>' : ''}
      ${coach}
      <div class="mk-portal-info-bar">
        <div class="mk-portal-info-cell">
          <span class="mk-portal-info-ico" aria-hidden="true">🕐</span>
          <span class="mk-portal-info-lbl">Plano</span>
          <strong>20 min</strong>
        </div>
        <div class="mk-portal-info-cell">
          <span class="mk-portal-info-ico" aria-hidden="true">🚗</span>
          <span class="mk-portal-info-lbl">Veículo</span>
          <strong>Carro 01</strong>
        </div>
        <div class="mk-portal-info-cell">
          <span class="mk-portal-info-ico" aria-hidden="true">🛡️</span>
          <span class="mk-portal-info-lbl">Status</span>
          <strong class="mk-portal-status ${stCls}">${stLabel}</strong>
        </div>
      </div>
      ${trophy}
      <button type="button" class="mk-portal-foto-btn" style="${fotoStyle}">${p.fotoLabel}</button>
      ${share}
      ${extend}
      <p class="mk-portal-pwa-hint">💡 Dica: adicione à tela inicial e deixe aberto no corredor</p>
    </article>
    ${p.multi ? '<p class="mk-portal-swipe-hint"><span aria-hidden="true">←</span> Deslize para ver outras crianças <span aria-hidden="true">→</span></p>' : ''}
    ${others}
  `;

  document.getElementById('aside-title').textContent = p.title;
  document.getElementById('aside-desc').textContent = p.desc;
  document.getElementById('aside-cards').innerHTML = p.cards.map(([t, s]) =>
    `<div class="mock-card"><span class="mock-badge">Por quê</span><strong>${t}</strong><span>${s}</span></div>`
  ).join('');
}

function avatar(nome, lg) {
  const girl = /a$|analu|maria|julia|sofia/i.test(nome);
  const src = girl ? '../../assets/avatar-girl.svg' : '../../assets/avatar-boy.svg';
  const cls = 'mk-portal-face' + (lg ? ' mk-portal-face--lg' : ' mk-portal-face--sm');
  return `<span class="${cls}"><img src="${src}" width="64" height="64" alt=""></span>`;
}

const bar = document.getElementById('phase-bar');
phases.forEach((p, i) => {
  const b = document.createElement('button');
  b.type = 'button';
  b.className = 'mock-phase-btn' + (i === 0 ? ' is-on' : '');
  b.textContent = p.label;
  b.setAttribute('role', 'tab');
  b.addEventListener('click', () => {
    bar.querySelectorAll('.mock-phase-btn').forEach(x => x.classList.remove('is-on'));

renderPhase(phases[0]);
