<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Movi Kids — Liberar Eduarda agora</title>
  <style>
    body { font-family: system-ui, sans-serif; max-width: 520px; margin: 40px auto; padding: 0 16px; }
    button { font-size: 16px; padding: 12px 20px; margin: 8px 0; width: 100%; cursor: pointer; }
    input { font-size: 16px; padding: 10px; width: 100%; box-sizing: border-box; margin: 6px 0 12px; }
    .ok { color: #0a7; } .err { color: #c00; }
    pre { background: #f4f4f4; padding: 12px; overflow: auto; font-size: 13px; }
    .hint { color: #555; font-size: 14px; }
  </style>
</head>
<body>
  <h1>Liberar Eduarda (emergência)</h1>
  <p class="hint">I144: PIN antigo <code>1416</code> nestas páginas não libera mais. Digite o PIN admin atual. Preferência: <a href="../../ops-balcao.html">ops-balcao.html</a>.</p>
  <label for="pin">PIN admin</label>
  <input id="pin" type="password" inputmode="numeric" maxlength="8" autocomplete="one-time-code" placeholder="4 dígitos">
  <ol>
    <li>Liberar sessão do balcão</li>
    <li>Resetar PIN da Eduarda (id 1) — só se esquecer</li>
  </ol>
  <button type="button" id="btn-liberar">1) Só liberar sessão</button>
  <button type="button" id="btn-reset">2) Resetar PIN da Eduarda</button>
  <button type="button" id="btn-ambos">Liberar + resetar PIN</button>
  <p id="status"></p>
  <pre id="log"></pre>
  <script>
    const GAS = 'https://script.google.com/macros/s/AKfycbwakQ-_aWsF5lFGLsiwB5UvJ4AlpW88krSv8daPeMvULwX5FOIdMhGVgdGd0G35270Y/exec';
    const log = (t) => { document.getElementById('log').textContent += t + '\n'; };
    function adminPin() {
      return String(document.getElementById('pin').value || '').replace(/\D/g, '');
    }
    async function api(action, extra) {
      const pin = adminPin();
      if (pin.length < 4) throw new Error('Digite o PIN admin');
      const q = new URLSearchParams({ action, adminPin: pin, _t: String(Date.now()), ...extra });
      const r = await fetch(GAS + '?' + q, { cache: 'no-store' });
      return r.json();
    }
    async function run(mode) {
      const st = document.getElementById('status');
      st.textContent = 'Executando...';
      st.className = '';
      document.getElementById('log').textContent = '';
      try {
        if (mode === 'liberar' || mode === 'ambos') {
          const a = await api('liberarSessaoOperadorAdmin');
          log('Liberar: ' + JSON.stringify(a, null, 2));
          if (!a.ok) throw new Error(a.erro || 'Falha ao liberar');
        }
        if (mode === 'reset' || mode === 'ambos') {
          const b = await api('resetarPinOperadorAdmin', { operadorId: '1' });
          log('Reset PIN: ' + JSON.stringify(b, null, 2));
          if (!b.ok) throw new Error(b.erro || 'Falha no reset');
        }
        const c = await api('listarOperadoresLogin');
        log('Lista: ' + JSON.stringify(c, null, 2));
        const edu = (c.operadores || []).find(o => Number(o.id) === 1 || o.nome === 'Eduarda');
        const livre = !(c.sessaoAtiva && c.sessaoAtiva.nome);
        if (mode === 'liberar') {
          st.textContent = livre ? 'Sessão liberada.' : 'Ainda ativo: ' + (c.sessaoAtiva && c.sessaoAtiva.nome);
          st.className = livre ? 'ok' : 'err';
        } else if (c.ok && edu && !edu.hasPin) {
          st.textContent = 'Pronto! Eduarda sem PIN — no app: login → Eduarda → criar PIN novo.';
          st.className = 'ok';
        } else if (c.ok && edu && edu.hasPin) {
          st.textContent = (mode === 'reset' || mode === 'ambos')
            ? 'Servidor ainda mostra PIN. Apague colunas D e E na aba OPERADORES_SISTEMA (planilha).'
            : 'OK parcial — veja o log.';
          st.className = (mode === 'reset' || mode === 'ambos') ? 'err' : 'ok';
        } else {
          st.textContent = 'Verifique o log abaixo.';
          st.className = 'err';
        }
      } catch (e) {
        st.textContent = 'Erro: ' + e.message;
        st.className = 'err';
      }
    }
    document.getElementById('btn-liberar').onclick = () => run('liberar');
    document.getElementById('btn-reset').onclick = () => run('reset');
    document.getElementById('btn-ambos').onclick = () => run('ambos');
  </script>
</body>
</html>
